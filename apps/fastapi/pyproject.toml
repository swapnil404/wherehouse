[project]
name = "wherehouse-geo-api"
version = "0.3.0"
description = "Wherehouse Geo scoring API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "h3>=4.0",
    "scikit-learn>=1.3",
    "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
py-modules = ["config", "data", "hotspots", "main", "schemas", "scoring"]
