[project]
name = "wherehouse-ingestion"
version = "0.1.0"
description = "Repeatable offline geospatial ingestion for Wherehouse"
requires-python = ">=3.11"
dependencies = [
    "geopandas==1.1.4",
    "h3==4.5.0",
    "numpy==2.5.3",
    "osmium==4.3.0",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.5",
    "pyarrow==25.0.1",
    "pyogrio==0.13.0",
    "python-dotenv==1.2.3",
    "rasterio==1.5.1",
    "requests==2.34.2",
    "shapely==2.1.2",
]

[project.scripts]
wherehouse-ingest = "wherehouse_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wherehouse_pipeline"]

[tool.ruff]
line-length = 100
